name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create the Android project and add our files
        run: |
          flutter create --org com.veraflow --project-name smsforwarder --platforms android /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
          cp -r overlay/android/. android/
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: sms-forwarder-apk
          path: build/app/outputs/flutter-apk/app-release.apk
